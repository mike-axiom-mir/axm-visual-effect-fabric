name: Verify Game VFX Runtime

on:
  push:
    paths:
      - "game-runtime/**"
      - ".github/workflows/game-runtime-verify.yml"
  pull_request:
    paths:
      - "game-runtime/**"
      - ".github/workflows/game-runtime-verify.yml"

permissions:
  contents: read

jobs:
  game-vfx-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: game-runtime
        run: npm test
